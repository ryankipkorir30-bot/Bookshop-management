
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Analytics | ChachaPkorir Bookshop</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background:#f4f7fb; color:#172033; font-family:Arial,sans-serif; }
    .analytics { max-width:1200px; margin:35px auto; padding:20px; }
    .analytics-header { display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap; }
    .analytics-header h1 { margin-bottom:6px; }
    .filters { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    select, .refresh-btn { padding:11px 14px; border:1px solid #d8deea; border-radius:9px; background:white; }
    .refresh-btn { cursor:pointer; background:#172554; color:white; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin:25px 0; }
    .stat, .chart-panel { background:white; border:1px solid #e5eaf2; border-radius:16px; padding:22px; box-shadow:0 5px 20px #15264b08; }
    .stat p { color:#64748b; margin:0 0 12px; }
    .stat h2 { font-size:clamp(22px,3vw,32px); margin:0; overflow-wrap:anywhere; }
    .chart-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .chart-panel h2 { font-size:18px; margin-top:0; }
    .chart-wrap { height:320px; position:relative; }
    #analyticsMessage { margin:15px 0; color:#475569; }
    #updatedAt { color:#64748b; font-size:13px; }
    @media(max-width:750px) {
      .stats,.chart-grid { grid-template-columns:1fr; }
      .analytics { padding:12px; }
    }
  </style>
</head>
<body>
  <main class="analytics">
    <header class="analytics-header">
      <div>
        <p>CHACHAPKORIR BOOKSHOP</p>
        <h1>Sales Analytics</h1>
        <p>Monitor paid revenue and books sold.</p>
      </div>
      <div class="filters">
        <label for="period">View:</label>
        <select id="period">
          <option value="day">Daily · Last 30 days</option>
          <option value="month">Monthly · Last 12 months</option>
          <option value="year">Yearly · Last 5 years</option>
        </select>
        <button id="refreshButton" class="refresh-btn">Refresh now</button>
      </div>
    </header>

    <p id="analyticsMessage" role="status">Loading sales data...</p>

    <section class="stats">
      <article class="stat">
        <p>Total paid revenue</p>
        <h2 id="revenueTotal">KSh 0.00</h2>
      </article>
      <article class="stat">
        <p>Books sold</p>
        <h2 id="booksTotal">0</h2>
      </article>
      <article class="stat">
        <p>Paid orders</p>
        <h2 id="ordersTotal">0</h2>
      </article>
    </section>

    <section class="chart-grid">
      <article class="chart-panel">
        <h2>Revenue trend (KSh)</h2>
        <div class="chart-wrap">
          <canvas id="revenueChart"></canvas>
        </div>
      </article>

      <article class="chart-panel">
        <h2>Books sold trend</h2>
        <div class="chart-wrap">
          <canvas id="booksChart"></canvas>
        </div>
      </article>
      <button id="logoutButton" type="button">Logout</button>
    </section>

    <p id="updatedAt">Waiting for data...</p>
    <p><a href="/admin/">Back to admin</a></p>
  </main>

  <script src="/admin/sales.js"></script>
</body>
</html>
